version: '3.8'

services:
  tapmap:
    image: olalie/tapmap:latest
    container_name: tapmap
    network_mode: host
    pid: host
    environment:
      - TAPMAP_IN_DOCKER=1
      - TAPMAP_PORT=8080
      # Configuración de ubicación local (elige una y descomenta):
      # - TAPMAP_LON=auto
      # - TAPMAP_LAT=auto
      # - TAPMAP_LON=10.7522
      # - TAPMAP_LAT=59.9139
      # - TAPMAP_LON=none
    volumes:
      - ~/tapmap-data:/data
      - ~/tapmap-data/geoip:/data/geoip
    restart: unless-stopped
    # Para visibilidad de procesos en Linux (opcional, requiere kernel compatible):
    # cap_add:
    #   - SYS_PTRACE